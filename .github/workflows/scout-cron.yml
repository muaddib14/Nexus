name: NEXUS Autonomous Scout Cycle

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scout-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger NEXUS Scout Webhook
        env:
          APP_URL: ${{ secrets.NEXUS_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$APP_URL" ]; then
            echo "Triggering $APP_URL/api/scout/cycle..."
            curl -X POST "$APP_URL/api/scout/cycle" \
              -H "Authorization: Bearer $CRON_SECRET" \
              --fail --show-error
          else
            echo "NEXUS_APP_URL secret is not configured yet. Skipping webhook trigger."
          fi
